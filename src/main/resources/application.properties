spring.application.name=hstudio
spring.config.import=optional:file:.env[.properties]
# ===================================================================
# CONFIGURATION GÉNÉRALE DU SERVEUR
# ===================================================================
server.port=8080

# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (PostgreSQL)[cite: 1]
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ===================================================================
# CONFIGURATION JPA / HIBERNATE (ORM)
# ===================================================================
# 'update' met à jour le schéma automatiquement (à adapter en production selon vos stratégies de migration comme Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Évite les problèmes de session ouverte trop longtemps (Best Practice Spring Boot)
spring.jpa.open-in-view=false

# ===================================================================
# JOURNALISATION (LOGS)
# ===================================================================
logging.level.org.springframework.security=INFO
logging.level.com.hstudio.crm=INFO

#====================================================================
# Configuration de l'echec de configuration
#====================================================================
app.security.login.max-failed-attempts=3
app.security.login.lock-duration=15m
app.security.login.otp-duration=10m
app.security.login.otp-max-attempts=5
app.security.login.otp-resend-cooldown=1m
app.security.login.mail-from=${MAIL_FROM:${MAIL_USERNAME:}}

# Configure these environment variables with the SMTP provider's credentials.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
